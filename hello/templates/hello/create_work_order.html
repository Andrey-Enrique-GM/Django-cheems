<style>
/* Oculto por defecto */
.hidden {
    display: none !important;
}

/* Fondo oscuro translúcido que cubre toda la pantalla */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

/* Tarjeta flotante centrada */
.modal-content {
    background-color: #ffffff;
    padding: 24px;
    border-radius: 8px;
    width: 90%;
    max-width: 480px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    font-family: Arial, sans-serif;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 1px solid #e0e0e0;
    padding-bottom: 10px;
}

.modal-header h2 {
    margin: 0;
    font-size: 1.25rem;
    color: #333;
}

.close-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #666;
}

.form-group {
    margin-bottom: 14px;
    text-align: left;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #444;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 8px 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95rem;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.btn-secondary {
    background-color: #6c757d;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
}

.btn-primary {
    background-color: #1e7e34;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
}

.btn-secondary:hover { background-color: #5a6268; }
.btn-primary:hover { background-color: #155724; }
</style>

<!-- Estructura del Modal -->
<div id="createWorkOrderModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Crear Orden de Trabajo</h2>
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        
        <form action="{% url 'create_work_order' %}" method="POST" class="modal-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="title">Título:</label>
                <input type="text" id="title" name="title" placeholder="Ej. Mantenimiento de equipo A" required>
            </div>

            <div class="form-group">
                <label for="description">Descripción:</label>
                <textarea id="description" name="description" rows="4" placeholder="Detalle de la orden de trabajo..." required></textarea>
            </div>

            <div class="form-group">
                <label for="status">Estado:</label>
                <select id="status" name="status">
                    <option value="1" selected>Pendiente</option>
                    <option value="2">En Proceso</option>
                    <option value="3">Completada</option>
                </select>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelModalBtn">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar Orden</button>
            </div>
        </form>
    </div>
</div>
